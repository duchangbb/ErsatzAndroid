plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ersatz'
    compileSdk 34

    defaultConfig {
        applicationId "com.ersatz"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    // ===== 签名配置 =====
    // keystore 放在项目根目录，CI 里通过 GitHub Secrets 还原
    signingConfigs {
        release {
            def ksFile = rootProject.file("ersatz.jks")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("ERSATZ_STORE_PASS") ?: "ersatz123"
                keyAlias System.getenv("ERSATZ_KEY_ALIAS") ?: "ersatz"
                keyPassword System.getenv("ERSATZ_KEY_PASS") ?: "ersatz123"
                // 关键：强制生成 v1 签名（LSPosed 对模块校验依赖 v1）
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // 仅当 keystore 存在时才绑定，避免本地无 key 时构建失败
            if (rootProject.file("ersatz.jks").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 关键：必须用 compileOnly！
    // 这样 Xposed API 只在编译期可见，不会被打进 APK 的 dex 中。
    // 如果把 de.robv.android.xposed 的类编进 APK，LSPosed 会拒绝加载整个模块，
    // 报错：The Xposed API classes are compiled into the module's APK.
    compileOnly 'de.robv.android.xposed:api:82'
}