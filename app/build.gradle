plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ersatz'
    compileSdk 34

    defaultConfig {
        applicationId "com.ersatz"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 说明：de.robv.android.xposed:api:82 已从 JCenter/MavenCentral 下架，
    // 无法在线解析。本工程改为在 src/main/java/de/robv/android/xposed/ 下
    // 内置最小 stub 源码（仅编译期使用，运行时由 LSPosed 注入真实实现）。
    // 因此这里不需要任何 Xposed 依赖。
}