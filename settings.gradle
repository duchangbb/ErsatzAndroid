    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Xposed 官方仓库：de.robv.android.xposed:api:82 仍在此处提供
        maven { url 'https://api.xposed.info/' }
    }
}
rootProject.name = "ErsatzAndroid"
include ':app'